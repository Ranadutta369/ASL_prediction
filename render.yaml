services:
  - type: web
    name: asl-prediction-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KMP_DUPLICATE_LIB_OK
        value: "TRUE"
      - key: PYTHON_VERSION
        value: "3.12.0"
